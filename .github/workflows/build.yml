name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        env:
          HUGINN_VERSION_CODE: ${{ github.run_number }}
          HUGINN_VERSION_NAME: 0.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :shared:testDebugUnitTest assembleRelease --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Put the real errors on the run page.
            grep -E '^e: ' build.log | sed 's#.*/huginn/##' | head -40 | sed 's/^/::error::/' || true
            awk '/What went wrong:/{f=1} f{print} /Try:/{exit}' build.log | head -30 | awk '{printf "%s%%0A", $0}' | sed 's/^/::error::/' || true
            echo
            exit "$status"
          fi
          cp app/build/outputs/apk/release/app-release.apk huginn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: huginn-apk
          path: huginn.apk

      # One always-up-to-date download at Releases > "Versão de teste".
      - name: Publish test build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGE: ${{ github.event.head_commit.message }}
        run: |
          gh release delete teste --yes --cleanup-tag || true
          subject=$(printf '%s' "$CHANGE" | head -1)
          notes=$(printf '%s\n\n%s' "$subject" "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe huginn.apk abaixo e abra no Thor para instalar.")
          gh release create teste huginn.apk \
            --prerelease \
            --title "Versão de teste (build ${{ github.run_number }})" \
            --notes "$notes"
